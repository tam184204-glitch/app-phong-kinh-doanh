<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phòng Kinh doanh · Cát Tường Group (bản demo)</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="fa.css">
<link rel="stylesheet" href="app.css?v=fb6c051b52">
<style>
#demobar{position:fixed;left:12px;bottom:12px;z-index:9999;background:#1E4E8C;color:#fff;font:12px/1.4 system-ui,sans-serif;padding:6px 10px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.2);opacity:.9}
#demobar a{color:#F5A623;cursor:pointer;margin-left:8px;text-decoration:underline}
#boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#f5f8fc;font:15px system-ui,sans-serif;color:#1E4E8C;z-index:10000}
#boot img{width:72px}
</style>
</head>
<body>
<div id="boot"><img src="logo.png" alt=""><b>CÁT TƯỜNG GROUP · PHÒNG KINH DOANH</b><span id="bootmsg">Đang tải…</span></div>
<div id="demobar" data-keep>Bản demo · dữ liệu mẫu lưu trên trình duyệt của bạn<a onclick="window.__ctgReset&&__ctgReset()">Làm mới dữ liệu</a></div>
<script type="module">
import './demo.js?v=dfb11eb249';
const local = new URLSearchParams(location.search).has('localpg');
const url = local ? new URL('pglite/index.js', location.href).href : 'https://cdn.jsdelivr.net/npm/@electric-sql/pglite@0.5.12/dist/index.js';
const bar = document.getElementById('demobar');
try {
  await window.__ctgBoot(url);
  for (const s of ['front.js?v=27d070c479']) await new Promise((res, rej) => { const el = document.createElement('script'); el.src = s; el.onload = res; el.onerror = rej; document.body.append(el); });
  document.getElementById('boot').remove();
  setInterval(() => { if (!bar.isConnected) document.body.append(bar); }, 800);
} catch (e) {
  console.error(e);
  document.getElementById('bootmsg').textContent = 'Không khởi động được bản demo: ' + e.message + ' — dữ liệu demo lưu trên trình duyệt này có thể đã hỏng.';
  const btn = document.createElement('button');
  btn.textContent = 'Xóa dữ liệu demo và nạp lại'; btn.style.cssText = 'padding:8px 16px;font:inherit;cursor:pointer';
  btn.onclick = () => window.__ctgReset && window.__ctgReset();
  document.getElementById('boot').append(btn);
}
</script>
</body>
</html>
